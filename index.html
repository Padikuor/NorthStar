<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NorthStar: career exploration for Bay Area high school and college students.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cpolygon points=%2250,0 61,39 100,50 61,61 50,100 39,61 0,50 39,39%22 fill=%22%232F5BEA%22/%3E%3C/svg%3E">
<title>NorthStar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
@property --p{syntax:"<number>";inherits:false;initial-value:0}
:root{
  --bg:#FFFFFF; --soft:#F5F6F8; --line:#E7E9ED; --ink:#0E1116; --muted:#6B7280;
  --accent:#2F5BEA; --accent-soft:#EEF2FE; --on-accent:#FFFFFF;
  --teal:#0E9F94; --teal-soft:#E2F5F3; --indigo:#5B4FD9; --indigo-soft:#EEEDFC; --amber:#E8962E; --amber-soft:#FDF2E1;
  --shadow:0 1px 2px rgba(14,17,22,.04),0 10px 30px -14px rgba(14,17,22,.18);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0E1116; --soft:#161A21; --line:#252A33; --ink:#F3F4F6; --muted:#9CA3AF; --accent:#7B96FF; --accent-soft:#1A2240; --on-accent:#0E1116; --teal:#3CCFC2; --teal-soft:#0F2A28; --indigo:#978DF5; --indigo-soft:#1F1C3D; --amber:#F5B94F; --amber-soft:#33270F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E1116; --soft:#161A21; --line:#252A33; --ink:#F3F4F6; --muted:#9CA3AF; --accent:#7B96FF; --accent-soft:#1A2240; --on-accent:#0E1116; --teal:#3CCFC2; --teal-soft:#0F2A28; --indigo:#978DF5; --indigo-soft:#1F1C3D; --amber:#F5B94F; --amber-soft:#33270F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding-inline:24px;padding-block:0 110px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(40px,6vw,76px)}
h2{font-size:clamp(28px,3.6vw,44px)}
h3{font-size:19px;letter-spacing:-.02em;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:14px}
.acc{color:var(--accent)}
.label{font-size:13px;font-weight:600;color:var(--muted)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-inline:-24px;padding:0 24px;border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-in{max-width:1120px;margin:0 auto;height:68px;display:flex;align-items:center;gap:28px}
.logo{border:0;background:none;padding:0;font-weight:700;font-size:18px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.logo i{width:20px;height:20px;background:var(--accent);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);position:relative}
.logo i:after{content:none}
.links{display:flex;gap:4px}
.links button{border:0;background:none;padding:8px 12px;border-radius:8px;font-size:14.5px;font-weight:500;color:var(--muted);transition:color .15s}
.links button:hover,.links button.on{color:var(--ink)}
.links button.on{font-weight:600}
.nav-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.menu-btn{display:none;border:0;background:var(--soft);width:40px;height:40px;border-radius:10px;font-size:18px}
@media (max-width:820px){.links{display:none}.menu-btn{display:block}
  .links.open{display:flex;flex-direction:column;position:absolute;top:68px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px}
  .links.open button{text-align:left;padding:12px 4px;font-size:17px}}
.progress{max-width:1120px;margin:8px auto 0;display:flex;gap:6px;align-items:center}
.progress button{flex:1;border:0;background:none;padding:10px 0 0;text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);border-top:2px solid var(--line);transition:color .2s,border-color .2s}
.progress button.done{border-top-color:var(--ink);color:var(--ink)}
.progress button.cur{border-top-color:var(--accent);color:var(--accent)}
.progress button:disabled{cursor:default}

/* buttons */
.btn{border:0;border-radius:10px;padding:14px 22px;font-weight:600;font-size:15.5px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;gap:10px;transition:transform .15s,opacity .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn .arr{transition:transform .2s}
.btn:hover .arr{transform:translateX(3px)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.btn.sm{padding:9px 14px;font-size:14px}
.btn:disabled{opacity:.3;cursor:default;transform:none}
.link{border:0;background:none;padding:0;font-weight:600;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.link:hover{color:var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.page{display:flex;flex-direction:column;gap:clamp(56px,9vw,112px);padding-top:clamp(28px,5vw,64px)}
.page.tight{gap:32px}
.in{animation:in .6s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}
@keyframes in{from{opacity:.001;transform:translateY(12px)}}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(32px,6vw,80px);align-items:center;min-height:min(640px,72vh)}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);min-height:0}}
.hero .sub{font-size:clamp(17px,1.5vw,19px);color:var(--muted);max-width:32ch;margin-top:22px}
.hero .row{margin-top:36px}
.portrait{position:relative;justify-self:center;width:min(420px,100%)}
.portrait .ph{aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:var(--soft)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.portrait:hover img{transform:scale(1.03)}
.tag{position:absolute;left:-20px;bottom:28px;background:var(--bg);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.tag small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
@media (max-width:520px){.tag{left:10px}}
.live{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);flex:none}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
@media (max-width:760px){.trio{grid-template-columns:minmax(0,1fr)}}
.trio div{padding:28px 28px 0 0;display:flex;flex-direction:column;gap:8px}
.trio .n{font-size:13px;font-weight:600;color:var(--accent)}
.statline{display:flex;gap:clamp(24px,6vw,72px);flex-wrap:wrap}
.statline div{display:flex;flex-direction:column;gap:2px}
.statline b{font-size:clamp(36px,4.5vw,56px);font-weight:600;letter-spacing:-.04em;line-height:1}
.statline>div>span{font-size:14px;color:var(--muted)}
.statline b span{font:inherit;color:inherit}
.statline b em{font-style:normal;font-size:.5em;letter-spacing:-.02em;margin-left:4px}
.band{border-radius:24px;background:var(--ink);color:var(--bg);padding:clamp(32px,6vw,72px);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.band .btn{background:var(--bg);color:var(--ink)}
.foot{border-top:1px solid var(--line);padding-top:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* content pages */
.intro{max-width:720px;display:flex;flex-direction:column;gap:16px}
.intro p{font-size:18px;color:var(--muted)}
.steps3{display:flex;flex-direction:column}
.s3{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1fr);gap:24px;padding:40px 0;border-top:1px solid var(--line);align-items:center}
@media (max-width:760px){.s3{grid-template-columns:minmax(0,1fr)}}
.s3 .n{font-size:56px;font-weight:600;letter-spacing:-.05em;color:var(--line);line-height:1}
.s3 .vis{background:var(--soft);border-radius:16px;padding:22px;min-height:140px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.mini-chips{display:flex;flex-wrap:wrap;gap:6px}
.mini-chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.mini-chips span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mini-tl{display:flex;gap:3px;height:36px}
.mini-tl div{border-radius:6px;font-size:11px;font-weight:600;display:flex;align-items:flex-end;padding:6px 8px;color:#fff;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(.001)}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}}
.grid2 div{background:var(--bg);padding:28px;display:flex;flex-direction:column;gap:6px}
.grid2 b{font-weight:600;font-size:17px}
.grid2 span{color:var(--muted);font-size:14.5px}

/* rings */
.ring{--p:0;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--line) 0);position:relative;animation:ringin 1.1s cubic-bezier(.2,.8,.2,1) both;flex:none}
.ring:before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;font-size:14px;font-weight:700;letter-spacing:-.02em}
.ring.lg{width:72px;height:72px}.ring.lg:before{inset:5px}.ring.lg b{font-size:18px}
@keyframes ringin{from{--p:0}}

/* careers page */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;background:var(--bg);color:var(--ink)}
.search:focus{outline:none;border-color:var(--ink)}
.fchip{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--bg);font-weight:600;font-size:14px;color:var(--ink)}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.clist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.citem{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:18px 4px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;transition:background .15s,padding .2s}
.citem:hover{background:var(--soft);padding-inline:14px}
.citem b{font-weight:600;font-size:17px}
.citem small{display:block;color:var(--muted);font-size:13px}
.citem .num{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.citem .num small{font-weight:500}
@media (max-width:560px){.citem{grid-template-columns:minmax(0,1fr) auto}.citem .yrs{display:none}}

/* flow */
.flow{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:28px;padding-top:24px}
.qhead{display:flex;flex-direction:column;gap:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{position:relative;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:16px 44px 16px 16px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:scale(.98)}
.opt b{font-weight:600;font-size:15px;line-height:1.3}
.opt small{font-size:12.5px;color:var(--muted)}
.opt .mark{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:700;transition:all .15s}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .mark{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.lv1 .mark{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt.lv1{border-color:var(--accent)}
.opt.lv2{border-color:var(--accent);background:var(--accent-soft)}
.opt.lv2 .mark{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stage{position:relative;min-height:220px;display:grid;place-items:center}
.card{width:100%;border:1px solid var(--line);border-radius:20px;background:var(--bg);box-shadow:var(--shadow);padding:44px 32px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:cin .35s cubic-bezier(.2,.8,.2,1) both;position:relative;z-index:1}
.card .q{font-size:clamp(21px,2.6vw,28px);font-weight:600;letter-spacing:-.03em;line-height:1.25;max-width:24ch}
.card.out-l{animation:ol .22s ease-in forwards}.card.out-r{animation:or .22s ease-in forwards}.card.out-u{animation:ou .22s ease-in forwards}
.behind{position:absolute;inset:14px 24px -12px;border-radius:20px;border:1px solid var(--line);background:var(--soft)}
@keyframes cin{from{opacity:.001;transform:translateY(16px) scale(.97)}}
@keyframes ol{to{opacity:0;transform:translateX(-50px) rotate(-4deg)}}
@keyframes or{to{opacity:0;transform:translateX(50px) rotate(4deg)}}
@keyframes ou{to{opacity:0;transform:translateY(-30px)}}
.answer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.answer button{border:1px solid var(--line);border-radius:12px;padding:14px 8px;font-weight:600;font-size:15px;background:var(--bg);transition:border-color .15s,background .15s}
.answer button:hover{border-color:var(--ink)}
.answer button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.answer kbd{display:block;font-family:var(--font);font-size:11px;font-weight:500;opacity:.55}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.a{background:var(--ink)}.dots i.c{background:var(--accent);transform:scale(1.4)}
.bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.qnav{display:flex;justify-content:space-between;gap:12px;padding-top:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:13px 14px;font:inherit;color:var(--ink);width:100%}
.field input:focus,.field select:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.pform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.pform{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:9px 16px;font-weight:600;font-size:14px;color:var(--muted);transition:all .15s}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:var(--shadow)}
.switch{display:flex;align-items:center;gap:12px;font-weight:500;font-size:15px;border:0;background:none;padding:0;text-align:left}
.switch i{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch i:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch.on i{background:var(--accent)}.switch.on i:after{transform:translateX(18px)}

/* results */
.who{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:center}
@media (max-width:800px){.who{grid-template-columns:minmax(0,1fr)}}
.radar{width:100%;max-width:300px;justify-self:center;color:var(--ink)}
.radar text{font-family:var(--font);font-size:11px;font-weight:600;fill:var(--muted)}
.radar .poly{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:2;transform-origin:150px 150px;animation:radar .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes radar{from{transform:scale(.001)}}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.pills span.a{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fields3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
@media (max-width:860px){.fields3{grid-template-columns:minmax(0,1fr)}}
.fcol{display:flex;flex-direction:column;gap:4px}
.fcol .label{padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:6px}
.mcard{border:0;background:none;text-align:left;padding:12px 8px;border-radius:12px;display:flex;gap:14px;align-items:center;transition:background .15s}
.mcard:hover{background:var(--soft)}
.mcard b{display:block;font-weight:600;font-size:15.5px;line-height:1.25}
.mcard small{color:var(--muted);font-size:12.5px}
.wild{border:1px dashed var(--muted);border-radius:16px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}

/* choose */
.chooser{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;align-items:start}
@media (max-width:960px){.chooser{grid-template-columns:minmax(0,1fr)}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:16px;background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:14px;transition:border-color .15s,box-shadow .2s}
.pc:hover{box-shadow:var(--shadow)}
.pc.main{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pc.keep{border-color:var(--ink)}
.pc .top{display:flex;justify-content:space-between;gap:10px}
.pc h3{font-size:16.5px}
.pc .meta{font-size:12.5px;color:var(--muted)}
.pbtns{display:flex;gap:6px;margin-top:auto}
.pbtns button{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 6px;font-weight:600;font-size:13px;background:var(--bg);transition:all .15s}
.pbtns button:hover{border-color:var(--ink)}
.pbtns .m.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pbtns .k.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pbtns .i{flex:0 0 38px}
.pbtns button:disabled{opacity:.3;cursor:default}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px}
@media (max-width:960px){.side{position:static}}
.side h3{font-size:21px}
.ovl{display:flex;gap:12px;align-items:center;font-size:14px}
.ovl b{display:block;font-weight:600}

/* roadmap */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:20px 20px 20px 0;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:clamp(24px,2.8vw,34px);font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}

var DB=load(), subs=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function fire(){subs.forEach(function(f){f();});}
function uid(){try{var u=localStorage.getItem("northstar.uid");if(!u){u="local-"+Math.random().toString(36).slice(2,10);localStorage.setItem("northstar.uid",u);}return u;}catch(e){return "local-user";}}
var db={
 collection:function(c){return{onSnapshot:function(ok){var f=function(){var m=DB[c]||{};ok({docs:Object.keys(m).map(function(id){return{id:id,data:function(){return m[id];}};})});};subs.push(f);setTimeout(f,0);return function(){subs.splice(subs.indexOf(f),1);};}};},
 doc:function(p){var s=p.split("/"),c=s[0],id=s[1];return{
  set:function(v){DB[c]=DB[c]||{};DB[c][id]=JSON.parse(JSON.stringify(v));save();setTimeout(fire,0);return Promise.resolve();},
  onSnapshot:function(ok){var f=function(){var v=(DB[c]||{})[id];ok({exists:!!v,id:id,data:function(){return v;}});};subs.push(f);setTimeout(f,0);return function(){subs.splice(subs.indexOf(f),1);};}};}
};

})();

/* ---------------- SCORING ---------------- */
function riasec(){
  const r={R:0,I:0,A:0,S:0,E:0,C:0};
  ACTS.forEach((a,i)=>{r[a[0]]+= (S.a.acts[i]||0)});
  return r; // 0..4 each
}
function topTypes(){const r=riasec();return Object.keys(r).sort((a,b)=>r[b]-r[a])}
function score(c){
  const pr=S.a.problems, w=[1,.85,.7];
  let ps=0,pmax=0; pr.forEach((p,i)=>{pmax+=w[i]; if(c.p.includes(p)) ps+=w[i]*(c.p.indexOf(p)===0?1:.85)});
  ps = pmax? ps/pmax : 0; ps=Math.min(1,ps*1.35);
  const r=riasec(), cw=[1,.6,.35]; let rs=0,rw=0;
  c.code.split("").forEach((L,i)=>{rs+=cw[i]*(r[L]/4); rw+=cw[i]});
  rs=rw?rs/rw:0;
  const vs = S.a.values.length? c.v.filter(v=>S.a.values.includes(v)).length/Math.min(3,S.a.values.length):0;
  let ss=0; c.s.forEach(s=>{const lv=S.a.subjects[s]||0; ss+= lv===2?1:lv===1?.8:0}); ss=Math.min(1,ss/Math.min(2,c.s.length));
  let total=.35*ps+.30*rs+.20*vs+.15*ss;
  const hz=(HORIZONS.find(h=>h.id===S.a.horizon)||{max:99}).max;
  const yrs=minYears(c); const longer = yrs>hz+1.5;
  if(longer) total-=.05;
  const why=[];
  const hit=pr.filter(p=>c.p.includes(p)); if(hit.length) why.push("Works on "+hit.map(probT).map(s=>s.toLowerCase()).join(" and "));
  const tt=topTypes().slice(0,2).filter(L=>c.code.slice(0,2).includes(L)); if(tt.length) why.push("Fits the "+tt.map(L=>RIASEC[L]).join(" + ")+" in you");
  const vh=c.v.filter(v=>S.a.values.includes(v)); if(vh.length) why.push("Offers "+vh.map(valT).map(s=>s.toLowerCase()).join(", "));
  if(longer) why.push("Longer road than you planned, but "+c.door.toLowerCase()+" gets you in sooner");
  return {c,score:Math.max(0,Math.min(1,total)),why,longer};
}
function band(s){return s>=.62?["Strong fit",""]:s>=.45?["Good fit","good"]:["Stretch","stretch"]}
function ranked(){return CAREERS.map(score).sort((a,b)=>b.score-a.score)}
function fieldsRanked(){
  const R=ranked(), g={};
  R.forEach(r=>{(g[r.c.sec]=g[r.c.sec]||[]).push(r)});
  const F=Object.entries(g).map(([sec,list])=>({sec,list,score:list.slice(0,2).reduce((a,b)=>a+b.score,0)/Math.min(2,list.length)}));
  F.sort((a,b)=>b.score-a.score);
  const top=F.slice(0,3);
  const inTop=new Set(top.map(f=>f.sec));
  const p1=S.a.problems[0];
  const wild = R.find(r=>!inTop.has(r.c.sec) && (!p1 || r.c.p.includes(p1))) || R.find(r=>!inTop.has(r.c.sec));
  return {top,wild,R};
}

function routesFor(c){
  const aft=c.after||[]; const R=[];
  if(c.edu==="appr"){
    R.push({name:"Earn while you learn",steps:[["Pre-apprenticeship or community college electrical courses",0.5,"cc"],["Paid apprenticeship",4.5,"appr"],["State certification exam",0.2,"lic"]]});
    R.push({name:"Degree first",steps:[["AS in Electrical Technology",2,"cc"],["Paid apprenticeship (some credit for courses)",4,"appr"],["State certification exam",0.2,"lic"]]});
  } else if(c.edu==="aa"){
    R.push({name:"Community college program",steps:[...c.fast,...(c.lic?[["Certification or license exam",0.2,"lic"]]:[])]});
    R.push({name:"Bachelor's route",steps:[["Community college",2,"cc"],["Transfer to a CSU",2,"uni"]]});
  } else {
    const lic = c.lic && c.edu==="ba" && !aft.length ? [["Licensing exam",0.3,"lic"]] : [];
    R.push({name:"Transfer route",steps:[["Community college, Associate Degree for Transfer",2,"cc"],["Transfer to a UC or CSU",2,"uni"],...aft,...lic]});
    R.push({name:"Direct to university",steps:[["UC, CSU, or private university",4,"uni"],...aft,...lic]});
  }
  if(c.alt) R.push(c.alt);
  return R;
}
const yearsOf = r => r.steps.reduce((a,s)=>a+s[1],0);
function minYears(c){return Math.min(...routesFor(c).map(yearsOf))}
function fmtY(y){const r=Math.round(y*2)/2; return (r%1? r.toFixed(1):r)}

function hsPlan(c){
  const M={calc:["Integrated Math I","Integrated Math II","Integrated Math III","Precalculus (or AP Calculus if accelerated)"],
           stats:["Integrated Math I","Integrated Math II","Integrated Math III","AP Statistics or Data Science"],

  return {
   9:[["English 9","b"],[M[0],"c"],["Biology","d"],["World Language 1","e"],["Ethnic Studies (1 semester)","a"],["PE","PE"]],
   10:[["English 10","b"],[M[1],"c"],["Chemistry","d"],["World History","a"],["World Language 2","e"],["Intro to "+c.cte,"CTE"]],
   11:[["English 11 or AP Language","b"],[M[2],"c"],[c.adv[0][0],c.adv[0][1]],["U.S. History","a"],["Visual or Performing Arts","f"],[c.cte+" (concentrator)","CTE"]],
   12:[["English 12","b"],[M[3],"c"],[c.adv[1][0],c.adv[1][1]],["Government and Economics","a"],["Personal Finance (1 semester)","g"],[c.cte+" capstone","CTE"],["Dual enrollment: "+c.de,"DE"]]
  };
}
function xpFor(c,g){
  return {9:["Explore","Join one club or program tied to "+(S.a.problems[0]?probT(S.a.problems[0]).toLowerCase():"a problem you care about")],
          10:["Meet","Job shadow or interview a "+c.t.toLowerCase()],
          11:["Try","Summer program or internship. "+c.tr[0]],
          12:["Launch","Apply to UC, CSU, and community college in the fall. File the FAFSA or CA Dream Act Application early"]}[g];
}
function overlap(a,b){
  const flat=c=>{const p=hsPlan(c);return new Set([...Object.values(p).flat().map(x=>x[0]),c.cte])};
  const A=flat(a),B=flat(b); let n=0; A.forEach(x=>{if(B.has(x))n++}); return Math.round(n/A.size*100);
}

function coachLine(){
  const v=S.view, n=esc(nm());
  if(v==="profile") return "Hi, I'm Ida. Let's start with you.";
  if(v==="assess"&&S.step===0&&!S.ipMode) return "Hi "+n+"! Full or quick? Full is more accurate, and quick is fine if you’re short on time.";
  if(v==="assess"&&S.step===0&&ipDone()) return S.ipMode==="quick"?"Nice. Answer the other 30 anytime to sharpen your matches.":"Nice work. Change anything that feels off, then hit Next.";
  if(v==="assess") return ["Hi "+n+"! Like, not sure, or dislike? Go with your gut. Keys 1, 2, 3 work too.","Which problems would you love to solve? Pick up to three.","Pick the three that matter most.","Tap once for enjoy, twice for strong.","Last one."][S.step];
  if(v==="fields"){const t=topTypes(); return "You're "+(/^[AEIOU]/.test(RIASEC[t[0]])?"an":"a")+" <b>"+RIASEC[t[0]]+"</b> with a <b>"+RIASEC[t[1]]+"</b> streak. Tap a career to peek.";}
  if(v==="choose") return "Pick up to three to explore. You can swap anytime.";
  if(v==="roadmap"){const c=byId[S.main]; return c?"One possible route to <b>"+esc(c.t)+"</b>. Branch out below if you’re curious.":"";}

}
function chipsFor(){

  if(v==="roadmap"||v==="classroom") return [["week","What can I do this week?"],["pay","How do I pay for college?"],["cc","Is community college smart?"]];

}

function renderNav(){
  const inApp=APP.includes(S.view);
  $("#links").className="links"+(menuOpen?" open":"");
  $("#links").innerHTML=PAGES.map(([id,l])=>`<button data-go="${id}" class="${S.view===id?"on":""}">${l}</button>`).join("");
  $("#navRight").innerHTML=(S.main&&!inApp?`<button class="btn ghost sm" data-go="roadmap">Exploring</button>`:"")+(inApp?"":`<button class="btn sm" data-go="${S.done?"fields":"profile"}">${S.done?"Continue":"Start"}</button>`)+`<button class="theme-btn" data-act="theme" aria-label="Switch to ${isDark()?"light":"dark"} mode" title="Switch to ${isDark()?"light":"dark"} mode">${isDark()?"☀":"☾"}</button><button class="menu-btn" data-act="menu" aria-label="Menu">≡</button>`;
  if(inApp){
    const items=[["assess","Discover",true],["fields","Fields",S.done],["choose","Shortlist",S.done],["roadmap","Routes",!!S.main],["classroom","Share",!!S.main]];
    const cur=(S.view==="profile"||S.view==="analyzing")?"assess":S.view; const ci=items.findIndex(i=>i[0]===cur);
    $("#progress").innerHTML=items.map(([id,l,en],i)=>`<button data-go="${id}" class="${i===ci?"cur":i<ci?"done":""}" ${en?"":"disabled"}>${l}</button>`).join("");
  } else $("#progress").innerHTML="";
}

const TEENOK=o=>!/gambling|casino|bartend|liquor|funeral|embalm|tobacco/i.test(o.t+" "+o.onetTitle);
function hashStr(x){let h=7;for(const ch of String(x))h=(h*31+ch.charCodeAt(0))>>>0;return h;}
function branchesFor(c){
  const sl=new Set(SL()), base=c.hasR?c.r:null, sim=o=>base&&o.hasR?corr(base,o.r):0;
  const seen=new Set([c.id,...sl]);
  let cz=[]; (c.rel||[]).forEach(k=>{const o=byOnet[k]; if(o&&!seen.has(o.id)&&!cz.includes(o)) cz.push(o);});
  if(cz.length<3) CAREERS.filter(o=>o.sec===c.sec&&!seen.has(o.id)&&!cz.includes(o)).map(o=>[o,sim(o)]).sort((a,b)=>b[1]-a[1]).slice(0,3-cz.length).forEach(x=>cz.push(x[0]));
  cz=cz.slice(0,3); cz.forEach(o=>seen.add(o.id));
  const pool=CAREERS.filter(o=>!seen.has(o.id)&&TEENOK(o));
  const sk=pool.filter(o=>o.sec!==c.sec&&o.hasR).map(o=>[o,sim(o)]).sort((a,b)=>b[1]-a[1]);
  const seed=hashStr(c.id)+(S.wildSeed||0)*7919;
  const skills=base?sk.slice(0,3).map(x=>x[0]):[0,1,2].map(i=>sk[(seed+i*131)%sk.length]).filter(Boolean).map(x=>x[0]);
  skills.forEach(o=>seen.add(o.id));
  const used=new Set([...sl].map(id=>byId[id].sec)); used.add(c.sec);
  let far=pool.filter(o=>!seen.has(o.id)&&!used.has(o.sec)&&o.sal[1]); if(base) far=far.filter(o=>{const v=sim(o);return v>-.2&&v<.65;});
  const wild=far.length?far[seed%far.length]:null;
  return {cz,skills,wild};
}

function reqEmail(r){
  const subj="Job shadow request: "+r.student+" (grade "+r.grade+")";
  const body="Hi,\n\nI'd like to request a job shadow day through NorthStar.\n\n"+
   "Student: "+r.student+", grade "+r.grade+", "+r.school+"\n"+
   "Mentor: "+r.mentorName+", "+r.mentorRole+" at "+r.mentorEmployer+" ("+r.mentorCity+")\n"+
   "Dates that could work: "+r.dates+"\n"+
   "Chaperone: "+r.chap+"\n"+
   (r.why?"Why I'm interested: "+r.why+"\n":"")+
   (r.path?"My career plan: "+r.path+"\n":"")+
   "\nMy parent or guardian knows I'm asking. Could you help with the permission form, the mentor's volunteer clearance, and a chaperone?\n\nThank you,\n"+r.student+
   "\n\n(Written with NorthStar. The NorthStar program coordinator has the mentor's contact details.)";
  return {subj,body,href:"mailto:"+r.counselor.replace(/[^A-Za-z0-9@._+-]/g,"")+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body)};
}

  if(d.chip)return chipAnswer(d.chip,t.textContent);
  if(d.grade){S.profile.grade=d.grade==="college"?"college":+d.grade; if(S.view!=="profile") return soft(); document.querySelectorAll("[data-grade]").forEach(b=>b.classList.toggle("on",b===t)); save(); return;}
  if(d.prob){const a=S.a.problems,i=a.indexOf(d.prob); if(i>=0)a.splice(i,1); else if(a.length<3)a.push(d.prob); return soft();}
  if(d.ans!==undefined)return answerAct(+d.ans);
  if(d.ipmode){S.ipMode=d.ipmode; S.actIdx=ipFirstOpen(); return soft();}
  if(d.racts!==undefined){S.a.acts[+d.racts]=+d.val; return soft();}
  if(d.valId){const a=S.a.values,i=a.indexOf(d.valId); if(i>=0)a.splice(i,1); else if(a.length<3)a.push(d.valId); return soft();}
  if(d.cyc){S.a.subjects[d.cyc]=((S.a.subjects[d.cyc]||0)+1)%3; return soft();}
  if(d.hz){S.a.horizon=d.hz; const r=$("#reflect"); if(r)S.a.reflect=r.value; return soft();}
  if(d.explore){viewShort(d.explore); $("#modal").innerHTML=""; return go("roadmap");}
  if(d.slview){viewShort(d.slview); return soft();}
  if(d.sldrop){dropShort(d.sldrop); if(S.view==="roadmap"&&!S.main) return go(S.done?"choose":"careers"); return S.view==="choose"?refreshChoose():soft();}
  if(d.slt){if(SL().includes(d.slt)) dropShort(d.slt); else addShort(d.slt); return refreshChoose();}
  if(d.main){S.main=d.main; S.keep=S.keep.filter(k=>k!==d.main); S.route=0; if(d.then){$("#modal").innerHTML="";return go(d.then);} return refreshChoose();}
  if(d.keep){const i=S.keep.indexOf(d.keep); if(i>=0)S.keep.splice(i,1); else{S.keep.push(d.keep); if(S.keep.length>2)S.keep.shift();} return refreshChoose();}
  if(d.filt){S.browseAll=d.filt==="all"; S.q=""; return soft();}
  if(d.route!==undefined){S.route=+d.route; return soft();}
  if(d.exp){S.exp=S.exp||{}; S.exp[d.exp]=!S.exp[d.exp]; return soft();}
  const a=d.act;
  if(a==="rcopy"){const t=$("#rText").textContent, m=$("#rcopyMsg"); const sel=()=>{const r=document.createRange();r.selectNodeContents($("#rText"));getSelection().removeAllRanges();getSelection().addRange(r);m.textContent="Selected. Press Ctrl+C or Cmd+C.";}; try{navigator.clipboard.writeText(t).then(()=>m.textContent="Copied. Paste it into a new email.").catch(sel)}catch(x){sel()} return;}
  if(a==="surprise")return surprise();
  if(a==="wildnew"){S.wildSeed=(S.wildSeed||0)+1; save(); const y=scrollY; const b=$("#branchSec"); if(b&&byId[S.main]){b.outerHTML=branchSection(byId[S.main]); window.scrollTo(0,y);} return;}
  if(a==="msignup")return mSignupSheet();
  if(a==="mfind"){$("#mdir")?.scrollIntoView({behavior:"smooth"});return;}
  if(a==="mmine"){mMine=!mMine; return mRefresh();}
  if(a==="goback")return goBack();
  if(a==="savepdf")return savePdf();
  if(a==="copyimg")return copyImg();
  if(a==="wmore"){wPage+=24; $("#wlist").innerHTML=watchRows(); return;}
  if(a==="more"){cPage+=60; $("#clist").innerHTML=careerRows(); return;}
  if(a==="theme"){setTheme(isDark()?"light":"dark"); return renderNav();}
  if(a==="menu"){menuOpen=!menuOpen; return renderNav();}
  if(a==="firstgen"){S.profile.firstGen=!S.profile.firstGen; t.classList.toggle("on",S.profile.firstGen); save(); return;}
  if(a==="example"){S=Object.assign(fresh(),JSON.parse(JSON.stringify(EXAMPLE)),{actIdx:60,ipMode:"full"}); return go("fields");}
  if(a==="next"){if(S.step===4){const r=$("#reflect"); if(r)S.a.reflect=r.value; S.done=true; go("analyzing"); const rm=matchMedia("(prefers-reduced-motion: reduce)").matches; setTimeout(()=>{if(S.view==="analyzing")go("fields")},rm?300:2600); return;} S.step++; return go("assess");}
  if(a==="back"){if(S.step===0&&S.ipMode&&S.actIdx>0&&S.actIdx<ipQueue().length){S.actIdx--;return soft();} if(S.step===0&&S.ipMode&&S.actIdx===0&&!ipAnswered()){S.ipMode=null;return soft();} if(S.step===0)return go("profile"); S.step--; return go("assess");}
  if(a==="redoacts"){S.a.acts={}; S.actIdx=0; S.ipMode=null; return soft();}
  if(a==="ipupgrade"){S.ipMode="full"; S.actIdx=ipFirstOpen(); if(S.view!=="assess"){S.step=0; return go("assess");} return soft();}
  if(a==="retake"){S.a={problems:[],acts:{},values:[],subjects:{},horizon:null,reflect:""}; S.done=false; S.main=null; S.keep=[]; S.step=0; S.actIdx=0; S.ipMode=null; S.example=false; return go("assess");}
  if(a==="reset"){S=fresh(); chatLog=[]; chatTurns=[]; return go("welcome");}
  if(a==="idaopen"){idaOpen=true; if(!chatLog.length)chatLog.push(["ai","Hi"+(S.profile.name?" "+S.profile.name:"")+"! Ask me anything, or tap a question."]); return renderIda();}
  if(a==="idaclose"){idaOpen=false; return renderIda();}
  if(a==="idahide"){idaHidden=true; return renderIda();}
  if(a==="copy"){const txt=summaryText(),m=$("#copyMsg"); try{navigator.clipboard.writeText(txt).then(()=>m.textContent="Copied.").catch(()=>selectCopy(m))}catch(err){selectCopy(m)}}
});
document.addEventListener("submit",async e=>{
  if(e.target.id==="mForm"){e.preventDefault(); const f=e.target, err=$("#mErr"), btn=f.querySelector("button[type=submit]"); btn.disabled=true;
    const doc={name:$("#mName").value.trim(),role:$("#mRole").value.trim(),employer:$("#mEmp").value.trim(),city:$("#mCity").value,sector:$("#mSec").value,avail:[...f.querySelectorAll("[data-av].on")].map(b=>b.dataset.av),commitments:COMMITS.length,updated:Date.now()};
    try{await MT.db.doc("mentors/"+MT.uid).set(doc); await MT.db.doc("mentorContacts/"+MT.uid).set({email:$("#mEmail").value.trim(),phone:$("#mPhone").value.trim()}); f.innerHTML=`<span class="label">Thank you</span><h2>You’re listed.</h2><p class="muted">Students can request a day with you through their school counselor, who will contact you and arrange volunteer clearance first.</p><button type="button" class="btn" data-close="1">Done</button>`;}
    catch(x){btn.disabled=false; err.textContent=x&&x.code==="invalid_argument"?"You need contributor access to this page to sign up. Ask the page owner.":"Couldn't save. Try again.";}
    return;}
  if(e.target.id==="rForm"){e.preventDefault(); const f=e.target, m=MT.mentors.find(x=>x.id===f.dataset.mid)||{}; const c=byId[S.main];
    const r={id:"r"+Date.now().toString(36),mentorName:m.name||"",mentorRole:m.role||"",mentorEmployer:m.employer||"",mentorCity:m.city||"Bay Area",student:$("#rName").value.trim(),grade:$("#rGrade").value,school:$("#rSchool").value.trim(),counselor:$("#rCouns").value.trim(),dates:$("#rDate").value.trim(),chap:$("#rChap").value,why:$("#rWhy").value.trim(),path:c?c.t:"",created:Date.now()};
    S.school=r.school; S.counselor=r.counselor; S.reqs=[r,...(S.reqs||[])].slice(0,10); save(); reqDoneSheet(r); if(S.view==="mentors") mRefresh(); return;}if(e.target.id==="profileForm"){e.preventDefault(); if(!S.profile.grade){const g=$(".seg");g.classList.add("shake");setTimeout(()=>g.classList.remove("shake"),500);return;} S.profile.name=$("#pName").value.trim(); S.profile.district=$("#pDist").value; S.example=false; S.step=0; S.actIdx=S.ipMode?ipFirstOpen():0; go("assess");}});
document.addEventListener("input",e=>{
  if(e.target.id==="cEmail"){S.counselor=e.target.value.trim(); save(); const c=byId[S.main]; const mb=$("#mailBtn"); if(mb&&c) mb.href=shareMailto(c); return;}
  if(e.target.id==="wq"){S.wq=e.target.value; wPage=24; $("#wlist").innerHTML=watchRows(); return;}
  if(e.target.id==="reflect"){S.a.reflect=e.target.value; save();}
  if(e.target.id==="q"){S.q=e.target.value; cPage=60; $("#clist").innerHTML=careerRows();}
  if(e.target.id==="cq"){S.q=e.target.value; $("#cgrid").innerHTML=chooseList();}
});
document.addEventListener("change",e=>{if(e.target.id==="wsec"){S.wsec=e.target.value; wPage=24; $("#wlist").innerHTML=watchRows(); return;}if(e.target.id==="secSel"){S.sectorF=e.target.value; cPage=60; $("#clist").innerHTML=careerRows(); save();}
  if(e.target.id==="eduSel"){S.eduF=e.target.value; cPage=60; $("#clist").innerHTML=careerRows(); save();}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#modal").innerHTML){$("#modal").innerHTML="";return;}
  if(S.view==="assess"&&S.step===0&&S.ipMode&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){const m={"1":0,"2":1,"3":2}[e.key]; if(m!==undefined)answerAct(m);}
});
window.addEventListener("scroll",()=>$("#nav").classList.toggle("scrolled",window.scrollY>8),{passive:true});
initMentors();
(async()=>{try{if(window.claude&&claude.use){const s=await claude.use("sample"); if(s){sampleFn=s; if(idaOpen)renderIda();}}}catch(e){}})();
if(S.view==="staff")S.view="mentors";
if(!["welcome","how","careers","watch","mentors","schools","meet",...APP].includes(S.view))S.view="welcome";
if(S.view==="analyzing")S.view=S.done?"fields":"assess";
render();

</script>

</body>
